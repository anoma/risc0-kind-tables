[workspace]
resolver = "3"
members = ["crates/kind-trees", "crates/integration-test"]

[workspace.package]
version = "1.0.0-rc.8"
keywords = ["anoma", "kind-tree", "protocol-adapter"]
authors = ["Anoma Foundation"]
license = "MIT"
repository = "https://github.com/anoma/risc0-kind-trees"
homepage = "https://anoma.net/"
edition = "2024"

[workspace.dependencies]
alloy = { version = "2.5.0", features = ["full"] }
alloy-chains = "0.2.39"
anoma-generic-call-forwarder-bindings = "2.0.0-rc.7"
# The circuit crates are pinned exactly: another build has another logic ref, and so another kind.
anoma-generic-call-library = { git = "https://github.com/anoma/generic-call-resource", rev = "2cf15befc7f905cb0edff08b1140739f8c8b1b66" }
anoma-pa-evm-bindings = { git = "https://github.com/anoma/pa-evm", rev = "15b0dd16541f7fdc0c45b725a24b7b58963770a9" }
anoma-pa-testkit = { git = "https://github.com/anoma/pa-testkit", rev = "8e124da1f640a29e7814a8c6fcdbf9419b6dfad6" }
anoma-rm-risc0 = { git = "https://github.com/anoma/arm-risc0", rev = "aaac2d2dc795c45c50615b0bf0ed5f8bc06cff9e", default-features = false, features = [
  "transaction",
] }
anomapay-erc20-forwarder-bindings = "3.0.0-rc.18"
anomapay_erc20_library = { git = "https://github.com/anoma/anomapay-erc20-resource", rev = "1909a334ebbfaad85af74a8ccd98658980107d0c" }
anomapay_erc20_witness = { git = "https://github.com/anoma/anomapay-erc20-resource", rev = "1909a334ebbfaad85af74a8ccd98658980107d0c" }
anyhow = "1.0.104"
bs58 = "0.5.1"
dotenvy = "0.15.7"
hex = "0.4.3"
k256 = { version = "0.13.3", features = ["arithmetic", "hash2curve"] }
# The legacy circuit, which the legacy forwarders accept. Tag v3.0.0-rc.2 ships it with a host crate for arm-risc0 2 and its own witness crate.
legacy-anomapay-erc20-library = { package = "transfer_library", git = "https://github.com/anoma/anomapay-erc20-resource", tag = "v3.0.0-rc.2" }
risc0-zkvm = { version = "3.0.6", default-features = false }
rstest = "0.28.0"
semver = "1.0.27"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }

# The e2e test crates of the protocol adapter and the ERC20 forwarder, pinned by git rev until they are released.
anoma-pa-evm-integration-test = { git = "https://github.com/anoma/pa-evm", rev = "15b0dd16541f7fdc0c45b725a24b7b58963770a9" }
anomapay-erc20-forwarder-integration-test = { git = "https://github.com/anoma/anomapay-erc20-forwarder", rev = "15d32a63bda385ba7a074e2a5b63984911745645" }

# The Solana deployment records, pinned by git commit.
anoma-pa-solana-client = { git = "https://github.com/anoma/anoma-pa-solana-client", rev = "7ed4f3ee29ec4f8840fd20599e28f2e50a79fb37" }
anomapay-spl-token-forwarder-client = { git = "https://github.com/anoma/anomapay-spl-token-forwarder", rev = "e122e5106298bad753af89286705424b851fbba2" }
base64 = "0.22.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
solana-cluster-type = "2.2.1"
solana-program-pack = "3"
solana-pubkey = "3"
spl-token-interface = "3"

anoma-risc0-kind-trees = { path = "crates/kind-trees" }

# The circuit crates on crates.io take arm-risc0 from crates.io; this resolves it to the commit the workspace pins.
[patch.crates-io]
anoma-rm-risc0 = { git = "https://github.com/anoma/arm-risc0", rev = "aaac2d2dc795c45c50615b0bf0ed5f8bc06cff9e" }
anoma-rm-risc0-gadgets = { git = "https://github.com/anoma/arm-risc0", rev = "aaac2d2dc795c45c50615b0bf0ed5f8bc06cff9e" }
