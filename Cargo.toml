[workspace]
resolver = "3"
members = ["crates/kind-tables", "crates/integration-test"]

[workspace.package]
version = "1.0.0-rc.4"
keywords = ["anoma", "kind-table", "protocol-adapter"]
authors = ["Anoma Foundation"]
license = "MIT"
repository = "https://github.com/anoma/risc0-kind-tables"
homepage = "https://anoma.net/"
edition = "2024"

[workspace.dependencies]
alloy = { version = "2.3.0", features = ["full"] }
alloy-chains = "0.2.36"
anoma-generic-call-forwarder-bindings = "2.0.0-rc.4"
# The circuit crates are pinned exactly: another build has another logic ref, and so another kind.
anoma-generic-call-library = "=3.0.0-rc.3"
anoma-pa-evm-bindings = "3.0.0-rc.13"
anoma-rm-risc0 = { version = "=2.0.0-rc.6", default-features = false, features = [
  "transaction",
] }
anomapay-erc20-forwarder-bindings = "3.0.0-rc.12"
anyhow = "1.0.104"
bs58 = "0.5.1"
dotenvy = "0.15.7"
hex = "0.4.3"
k256 = { version = "0.13.3", features = ["arithmetic", "hash2curve"] }
risc0-zkvm = { version = "3.0.3", default-features = false }
semver = "1.0.27"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
transfer_library = "=3.0.0-rc.3"
transfer_witness = "=3.0.0-rc.3"

# The Solana deployment record and the AnomaPay Solana resource, pinned by commit.
anoma-pa-solana-client = { git = "https://github.com/anoma/anoma-pa-solana-client", rev = "4c034a946d34ba09e5ce845fcae1c8880babe0cb" }
anomapay-spl-token-forwarder-client = { git = "https://github.com/anoma/anomapay-spl-token-forwarder", rev = "54eabb1fc80b7b8accc121c91d72d898c55d855d" }
anomapay-solana-transfer-library = { package = "transfer_library", git = "https://github.com/anoma/anomapay-solana-resource", rev = "f550cacad7dc176211db9e2990074c9e5df2e021" }
anomapay-solana-transfer-library-rc2 = { package = "transfer_library", git = "https://github.com/anoma/anomapay-solana-resource", rev = "8969825eef8b676822207a420716fdad9b5eda24" }
anomapay-solana-transfer-library-rc3 = { package = "transfer_library", git = "https://github.com/anoma/anomapay-solana-resource", rev = "ac4c933e6bc9e52f7f7fd53b65ba687e6bfa1f78" }
base64 = "0.22.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
solana-cluster-type = "2.2.1"
solana-program-pack = "3"
solana-pubkey = "3"
spl-token-interface = "3"

anoma-risc0-kind-tables = { path = "crates/kind-tables" }
