[workspace]
resolver = "3"
members = ["crates/kind-tables", "crates/integration-test"]

[workspace.package]
version = "1.0.0-rc.7"
keywords = ["anoma", "kind-table", "protocol-adapter"]
authors = ["Anoma Foundation"]
license = "MIT"
repository = "https://github.com/anoma/risc0-kind-tables"
homepage = "https://anoma.net/"
edition = "2024"

[workspace.dependencies]
alloy = { version = "2.3.0", features = ["full"] }
alloy-chains = "0.2.36"
anoma-generic-call-forwarder-bindings = "2.0.0-rc.6"
# The circuit crates are pinned exactly: another build has another logic ref, and so another kind.
anoma-generic-call-library = "=2.0.0-rc.1"
anoma-pa-evm-bindings = "3.0.0-rc.17"
anoma-pa-testkit = "1.0.0-rc.2"
anoma-rm-risc0 = { version = "=2.0.0-rc.7", default-features = false, features = [
  "transaction",
] }
anomapay-erc20-forwarder-bindings = "3.0.0-rc.16"
anomapay_erc20_library = "=2.0.0-rc.1"
anomapay_erc20_witness = "=2.0.0-rc.1"
anyhow = "1.0.104"
bs58 = "0.5.1"
dotenvy = "0.15.7"
hex = "0.4.3"
k256 = { version = "0.13.3", features = ["arithmetic", "hash2curve"] }
# The legacy circuit, which the legacy forwarders accept. Tag v3.0.0-rc.2 ships it with a host crate for arm-risc0 2 and its own witness crate.
legacy-anomapay-erc20-library = { package = "transfer_library", git = "https://github.com/anoma/anomapay-erc20-resource", tag = "v3.0.0-rc.2" }
risc0-zkvm = { version = "3.0.3", default-features = false }
rstest = "0.26.1"
semver = "1.0.27"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }

# The e2e test crates of the protocol adapter and the ERC20 forwarder, pinned by git tag.
anoma-pa-evm-integration-test = { git = "https://github.com/anoma/pa-evm", tag = "bindings/v3.0.0-rc.17" }
anomapay-erc20-forwarder-integration-test = { git = "https://github.com/anoma/anomapay-erc20-forwarder", tag = "bindings/v3.0.0-rc.15" }

# The Solana deployment record and the AnomaPay Solana resource, pinned by git tag.
anoma-pa-solana-client = { git = "https://github.com/anoma/anoma-pa-solana-client", tag = "bindings/v0.7.0" }
anomapay-spl-token-forwarder-client = { git = "https://github.com/anoma/anomapay-spl-token-forwarder", tag = "bindings/v0.4.0" }
anomapay-solana-transfer-library = { package = "transfer_library", git = "https://github.com/anoma/anomapay-solana-resource", tag = "v2.0.0-rc.7" }
base64 = "0.22.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
solana-cluster-type = "2.2.1"
solana-program-pack = "3"
solana-pubkey = "3"
spl-token-interface = "3"

anoma-risc0-kind-tables = { path = "crates/kind-tables" }
