name: Crates

on:
  push:
    branches: [main, staging, next]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Crates Tests
    runs-on: ubuntu-latest
    env:
      RISC0_SKIP_BUILD_KERNELS: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Show Rust version
        run: rustc --version

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run rustfmt
        run: just crates-fmt-check

      - name: Build
        run: just crates-build

      - name: Lint
        run: just crates-lint

      - name: Check the generated tables match the source
        run: just generate-check

      - name: Run Tests
        run: just crates-test
        env:
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}

      - name: Install Foundry
        if: github.base_ref == 'staging' || github.base_ref == 'main'
        uses: foundry-rs/foundry-toolchain@v1

      # The soft-migration gate forks the staging chain and proves through the queue, so like the freshness gate it
      # runs only on a promotion pull request. The queue the secrets name must prove this resource machine version.
      - name: Run e2e Tests
        if: github.base_ref == 'staging' || github.base_ref == 'main'
        run: just crates-test-e2e
        env:
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
          QUEUE_BASE_URL: ${{ secrets.QUEUE_BASE_URL }}
          QUEUE_AUTH_TOKEN: ${{ secrets.QUEUE_AUTH_TOKEN }}
