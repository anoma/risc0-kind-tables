[package]
name = "anoma-risc0-kind-tables"
version.workspace = true
description = "The kind tables the Anoma protocol adapters are committed to, and the supported-token list they are built from."
keywords.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true

[features]
# Converts an entry into the resource machine's kind table entry, for a consumer that loads a table to prove.
arm = ["dep:anoma-rm-risc0"]
# The Solana deployment record: the forwarder program of each recorded cluster, read from anoma-pa-solana-client.
solana-deployments = ["dep:anoma-pa-solana-client"]
# The generator reads the live circuit IDs and forwarder deployments, which the library's consumers don't need.
generate = [
  "dep:anoma-generic-call-forwarder-bindings",
  "dep:anoma-generic-call-library",
  "dep:anoma-pa-evm-bindings",
  "dep:anoma-rm-risc0",
  "dep:anomapay-erc20-forwarder-bindings",
  "dep:anyhow",
  "dep:transfer_library",
]

[dependencies]
alloy = { workspace = true }
alloy-chains = { workspace = true }
anoma-generic-call-forwarder-bindings = { workspace = true, optional = true }
anoma-generic-call-library = { workspace = true, optional = true }
anoma-pa-evm-bindings = { workspace = true, optional = true }
anoma-pa-solana-client = { workspace = true, optional = true }
anoma-rm-risc0 = { workspace = true, optional = true }
anomapay-erc20-forwarder-bindings = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
bs58 = { workspace = true }
hex = { workspace = true }
k256 = { workspace = true }
risc0-zkvm = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
transfer_library = { workspace = true, optional = true }

[dev-dependencies]
anomapay-erc20-forwarder-bindings = { workspace = true }

[[bin]]
name = "generate"
required-features = ["generate"]
